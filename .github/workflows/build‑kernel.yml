name: Build SM8845 Kernel

on:
  push:
    branches: [ oneplus/sm8845 ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main kernel repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull common kernel source into common folder
        run: |
          git clone --depth 1 https://github.com/fgnb666ace2v/android_kernel_common_oneplus_sm8845 common

      - name: Pull devicetree & vendor files
        run: |
          git clone --depth 1 https://github.com/fgnb666ace2v/android_kernel_modules_and_devicetree_oneplus_sm8845 tempdt
          cp -r tempdt/kernel_platform ./
          cp -r tempdt/vendor ./
          rm -rf tempdt

      - name: Install build dependencies
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu mkbootimg build-essential libssl-dev clang lld

      - name: Compile kernel
  env:
    ARCH: arm64
    CROSS_COMPILE: aarch64-linux-gnu-
    CC: clang
    LD: ld.lld
  run: |
    make generic_auto_defconfig
    echo "CONFIG_KPM=y" >> .config
    echo "CONFIG_KPM_HOOK=y" >> .config
    echo "CONFIG_KPM_PROC_HOOK=y" >> .config
    echo "CONFIG_KPM_DEBUG=n" >> .config
    echo "CONFIG_KPM_ALLOW_UNSAFE_HOOK=y" >> .config
    echo "CONFIG_KPROBES=y" >> .config
    echo "CONFIG_KPROBE_EVENTS=y" >> .config
    echo "CONFIG_FTRACE=y" >> .config
    echo "CONFIG_FUNCTION_TRACER=y" >> .config
    echo "CONFIG_EVENT_TRACING=y" >> .config
    echo "CONFIG_DEBUG_FS=y" >> .config
    echo "CONFIG_MODVERSIONS=y" >> .config
    echo "CONFIG_MODULE_REL_CRCS=y" >> .config
    echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> .config
    echo "CONFIG_SECURITY_SELINUX_PERMISSIVE=y" >> .config
    make olddefconfig
    make -j$(nproc)

      - name: Generate boot.img
        run: |
          truncate -s 0 ramdisk
          mkbootimg \
            --kernel arch/arm64/boot/Image \
            --ramdisk ramdisk \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom" \
            --output boot.img

      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled‑Boot
          path: boot.img
