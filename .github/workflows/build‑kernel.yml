name: Build SM8845 Kernel
on:
  push:
    branches: [ oneplus/sm8845_b_16.0.0_ace_6t ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install basic packages
        run: |
          sudo apt update
          sudo apt install -y wget unzip mkbootimg build-essential libssl-dev

      - name: Download Google Clang r416183
        run: |
          wget https://dl.google.com/android/ndk/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "$PWD/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Compile Kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CLANG_TRIPLE: aarch64-linux-gnu-
        run: |
          make generic_auto_defconfig
          make -j$(nproc) CC=clang

      - name: Generate boot.img
        run: |
          mkbootimg --kernel out/arch/arm64/boot/Image -o boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: Compiled‑Boot
          path: boot.img