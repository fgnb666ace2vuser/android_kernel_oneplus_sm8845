name: Build SM8845 Kernel
on:
  push:
    branches: [ oneplus/sm8845_b_16.0.0_ace_6t ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整拉取全部代码，禁止浅克隆

      - name: Install dependencies & aarch64‑gcc
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu mkbootimg build-essential libssl-dev

      - name: Compile Kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make generic_auto_defconfig
          make -j$(nproc)

      - name: Generate boot.img
        run: |
          mkbootimg --kernel out/arch/arm64/boot/Image -o boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: Compiled‑Boot
          path: boot.img